name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tooling (TypeScript for checking, Playwright for browser tests)
        run: |
          npm install -g typescript@5 playwright
          npx playwright install --with-deps chromium
      - name: Typecheck
        run: tsc -p tsconfig.json
        env:
          NODE_PATH: ${{ env.NODE_PATH }}
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Browser tests
        run: |
          export NODE_PATH="$(npm root -g)"
          npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    # Runs the full browser suite against the real published URL.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install -g playwright
          npx playwright install --with-deps chromium
      - name: Wait for the site to serve this build
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ needs.deploy.outputs.page_url }}")
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "site did not return 200"; exit 1
      - name: Browser tests against the live site
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          export NODE_PATH="$(npm root -g)"
          npm run test:e2e
