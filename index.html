<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://accounts.google.com; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com https://api.anthropic.com https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; frame-src https://accounts.google.com; worker-src 'self' blob: https://cdn.jsdelivr.net; manifest-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#16181d">
  <meta name="description" content="ShowUp keeps every event you registered for in one place. Capture by voice, screenshot or text, and get reminded before it starts.">
  <title>ShowUp</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div id="auth-root" class="auth-root" hidden></div>
  <a class="skip" href="#view">Skip to content</a>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/today" aria-label="ShowUp, go to Today">
        <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="8" fill="currentColor"/>
          <path d="M9 17.5l4.5 4.5L23 11" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">ShowUp</span>
      </a>
      <nav aria-label="Main">
        <a href="#/today">Today</a>
        <a href="#/upcoming">Upcoming</a>
        <a href="#/calendar">Calendar</a>
        <a href="#/board">Board</a>
        <a href="#/pages">Pages</a>
        <a href="#/inbox" id="inbox-link">Approvals <span id="inbox-badge" class="badge" hidden></span></a>
        <a href="#/insights">Insights</a>
        <a href="#/capture">Capture</a>
        <a href="#/settings">Settings</a>
      </nav>
      <button id="palette-btn" class="btn btn-icon" type="button" aria-label="Open command palette (Ctrl or Command K)" title="Command palette (Ctrl/⌘ K)"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button id="theme-btn" class="btn btn-icon" type="button" aria-label="Toggle light or dark theme" title="Toggle theme"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
      <button id="lock-btn" class="btn btn-lock" type="button" hidden aria-label="Lock ShowUp" title="Lock ShowUp">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg><span class="add-label">Lock <span id="who" class="who"></span></span>
      </button>
      <button id="add-btn" class="btn btn-primary btn-add" type="button" aria-label="Add event">
        <span aria-hidden="true">+</span><span class="add-label"> Add</span>
      </button>
    </div>
  </header>
  <div id="catchup"></div>
  <main id="view" tabindex="-1">
    <p class="muted loading" role="status">Loading…</p>
  </main>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <noscript><p class="banner banner-warn">ShowUp needs JavaScript to run.</p></noscript>
  <script type="module" src="src/app/main.js"></script>
</body>
</html>
